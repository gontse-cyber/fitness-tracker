<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="java.js"></script>
  </head>
  <body>
    <section class="container">
      <h1>Fitness Tracker</h1>
      <form id="workout-form">
        <label for="workout-type">Workout Type:</label>
        <select id="workout-type" required>
          <option value="">Select Workout</option>
          <option value="Running">Running</option>
          <option value="Cycling">Cycling</option>
          <option value="Strength Training">Strength Training</option>
        </select>
        <input
          id="duration"
          placeholder="Duration (mins)"
          type="number"
          required
        />
        <input
          id="calories"
          placeholder="Calories Burned"
          type="number"
          required
        />
        <input id="date" placeholder="Date" type="date" required />
        <button type="submit">Add Workout</button>
      </form>

      <section id="statistics">
        <p>Total Workouts: <span id="total-workouts">0</span></p>
        <p>Total Calories: <span id="total-calories">0</span></p>
        <p>Average Duration: <span id="average-duration">0</span> mins</p>
      </section>

      <section id="goal-tracker">
        <h2>Fitness Goal Tracker</h2>
        <label for="goal">Set Goal: </label>
        <input type="text" id="activity" placeholder="e.g walk, run, burn" />
        <input type="number" id="goal" placeholder="Enter goal" />
        <label for="units">Unit type:</label>
        <select id="unit-type" required>
          <option value="">Select Unit</option>
          <option value="Running">kilometres</option>
          <option value="Burning">calories</option>
          <option value="Lifting">kilograms</option>
        </select>
        <button id="setGoalBtn">Set Goal</button>
        <br /><br />
        <label for="progress">Enter Progress: </label>
        <input type="number" id="progress" placeholder="Enter progress" />
        <button id="updateProgressBtn">Update Progress</button>
        <br /><br />
        <div class="progress-container">
          <div class="progress-bar" id="progressBar">0%</div>
        </div>
        <p id="message"></p>
        <p id="log"></p>

        <section id="workout-chart-container">
          <canvas id="workout-chart"></canvas>
        </section>

        <ul id="workout-list"></ul>
      </section>
      <button id="reminder-btn" onclick="showMotivationalQuote()">
        Motivation
      </button>
      <section id="motivation-quote"></section>
    </section>
  </body>
  <footer></footer>
</html>
